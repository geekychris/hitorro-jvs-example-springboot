server:
  port: 8080

spring:
  application:
    name: hitorro-jvs-example
  # REST JSON keeps the format the app had on Jackson 2 (Boot's Jackson 2 mapper):
  # Jackson 2 defaults plus Boot's ISO dates and lenient reads. The 2.18 stream
  # limits are set in JsonConfig. Pinned by GoldenRestTest.
  jackson:
    use-jackson2-defaults: true
  groovy:
    template:
      check-template-location: false

logging:
  level:
    com.hitorro: INFO
