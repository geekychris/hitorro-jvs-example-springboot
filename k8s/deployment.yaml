apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: hitorro-jvs-example-springboot
    app.kubernetes.io/managed-by: devportal
  name: hitorro-jvs-example-springboot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hitorro-jvs-example-springboot
  template:
    metadata:
      labels:
        app: hitorro-jvs-example-springboot
    spec:
      containers:
      - name: hitorro-jvs-example-springboot
        image: devportal/hitorro-jvs-example-springboot:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          periodSeconds: 10
          initialDelaySeconds: 10
          httpGet:
            path: /
            port: http
